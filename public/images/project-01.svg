<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" style="background: #f8fafc">
  <!-- Header -->
  <rect width="1600" height="80" fill="#ffffff"/>
  <rect x="40" y="25" width="120" height="30" rx="4" fill="#3b82f6"/>
  <text x="100" y="47" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">ShopFlow</text>

  <!-- Search Bar -->
  <rect x="600" y="20" width="400" height="40" rx="20" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Search products...</text>

  <!-- Header Icons -->
  <circle cx="1400" cy="40" r="18" fill="#f1f5f9"/>
  <circle cx="1460" cy="40" r="18" fill="#f1f5f9"/>
  <circle cx="1520" cy="40" r="18" fill="#3b82f6"/>

  <!-- Sidebar -->
  <rect x="0" y="80" width="280" height="820" fill="#ffffff"/>

  <!-- Sidebar Menu Items -->
  <rect x="20" y="120" width="240" height="48" rx="8" fill="#eff6ff"/>
  <rect x="35" y="132" width="24" height="24" rx="4" fill="#3b82f6"/>
  <text x="75" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="500">Dashboard</text>

  <rect x="35" y="192" width="24" height="24" rx="4" fill="#e2e8f0"/>
  <text x="75" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Products</text>

  <rect x="35" y="252" width="24" height="24" rx="4" fill="#e2e8f0"/>
  <text x="75" y="270" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Orders</text>

  <rect x="35" y="312" width="24" height="24" rx="4" fill="#e2e8f0"/>
  <text x="75" y="330" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Customers</text>

  <rect x="35" y="372" width="24" height="24" rx="4" fill="#e2e8f0"/>
  <text x="75" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Analytics</text>

  <rect x="35" y="432" width="24" height="24" rx="4" fill="#e2e8f0"/>
  <text x="75" y="450" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Settings</text>

  <!-- Main Content Area -->
  <rect x="280" y="80" width="1320" height="820" fill="#f8fafc"/>

  <!-- Page Header -->
  <text x="320" y="140" font-family="system-ui, sans-serif" font-size="28" fill="#0f172a" font-weight="700">Dashboard Overview</text>
  <text x="320" y="170" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Welcome back! Here's what's happening with your store today.</text>

  <!-- Stats Cards -->
  <!-- Card 1 -->
  <rect x="320" y="200" width="300" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="500">TOTAL REVENUE</text>
  <text x="340" y="270" font-family="system-ui, sans-serif" font-size="32" fill="#0f172a" font-weight="700">$45,231</text>
  <text x="340" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" font-weight="500">↑ 20.1%</text>
  <text x="385" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">from last month</text>

  <!-- Card 2 -->
  <rect x="640" y="200" width="300" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="660" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="500">TOTAL ORDERS</text>
  <text x="660" y="270" font-family="system-ui, sans-serif" font-size="32" fill="#0f172a" font-weight="700">2,345</text>
  <text x="660" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" font-weight="500">↑ 12.5%</text>
  <text x="705" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">from last month</text>

  <!-- Card 3 -->
  <rect x="960" y="200" width="300" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="980" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="500">NEW CUSTOMERS</text>
  <text x="980" y="270" font-family="system-ui, sans-serif" font-size="32" fill="#0f172a" font-weight="700">1,234</text>
  <text x="980" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" font-weight="500">↑ 8.2%</text>
  <text x="1025" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">from last month</text>

  <!-- Card 4 -->
  <rect x="1280" y="200" width="300" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1300" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="500">CONVERSION RATE</text>
  <text x="1300" y="270" font-family="system-ui, sans-serif" font-size="32" fill="#0f172a" font-weight="700">3.24%</text>
  <text x="1300" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#ef4444" font-weight="500">↓ 2.1%</text>
  <text x="1345" y="300" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">from last month</text>

  <!-- Chart Section -->
  <rect x="320" y="370" width="940" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="405" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a" font-weight="600">Sales Overview</text>
  <text x="340" y="430" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Revenue trends over the last 7 days</text>

  <!-- Simple Bar Chart -->
  <g transform="translate(360, 480)">
    <rect x="0" y="150" width="80" height="90" rx="4" fill="#dbeafe"/>
    <rect x="0" y="60" width="80" height="180" rx="4" fill="#3b82f6"/>
    <text x="40" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Mon</text>

    <rect x="120" y="80" width="80" height="160" rx="4" fill="#3b82f6"/>
    <text x="160" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Tue</text>

    <rect x="240" y="50" width="80" height="190" rx="4" fill="#3b82f6"/>
    <text x="280" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Wed</text>

    <rect x="360" y="90" width="80" height="150" rx="4" fill="#3b82f6"/>
    <text x="400" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Thu</text>

    <rect x="480" y="30" width="80" height="210" rx="4" fill="#3b82f6"/>
    <text x="520" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fri</text>

    <rect x="600" y="100" width="80" height="140" rx="4" fill="#3b82f6"/>
    <text x="640" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Sat</text>

    <rect x="720" y="120" width="80" height="120" rx="4" fill="#3b82f6"/>
    <text x="760" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Sun</text>
  </g>

  <!-- Recent Orders Section -->
  <rect x="1280" y="370" width="300" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1300" y="405" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a" font-weight="600">Recent Orders</text>

  <!-- Order Items -->
  <g transform="translate(1300, 440)">
    <circle cx="20" cy="0" r="16" fill="#dbeafe"/>
    <text x="50" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="500">Order #4521</text>
    <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">2 items • $234.00</text>
  </g>

  <g transform="translate(1300, 520)">
    <circle cx="20" cy="0" r="16" fill="#dbeafe"/>
    <text x="50" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="500">Order #4520</text>
    <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">1 item • $89.99</text>
  </g>

  <g transform="translate(1300, 600)">
    <circle cx="20" cy="0" r="16" fill="#dbeafe"/>
    <text x="50" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="500">Order #4519</text>
    <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">3 items • $456.50</text>
  </g>

  <g transform="translate(1300, 680)">
    <circle cx="20" cy="0" r="16" fill="#dbeafe"/>
    <text x="50" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="500">Order #4518</text>
    <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">1 item • $129.00</text>
  </g>

  <!-- Bottom section - Top Products -->
  <rect x="320" y="770" width="620" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="800" font-family="system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Top Products</text>

  <g transform="translate(340, 820)">
    <rect x="0" y="0" width="40" height="40" rx="6" fill="#f1f5f9"/>
    <text x="60" y="15" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="500">Wireless Headphones</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">245 sold</text>

    <rect x="240" y="0" width="40" height="40" rx="6" fill="#f1f5f9"/>
    <text x="300" y="15" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="500">Smart Watch</text>
    <text x="300" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">198 sold</text>
  </g>
</svg>